<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master - Play & Learn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">ChessMaster</div>
            <ul>
                <li><a href="#">Play</a></li>
                <li><a href="#">Puzzles</a></li>
                <li><a href="#">Learn</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="game-area">
            <div class="chessboard" id="board">
                <!-- Grid will be generated by JavaScript -->
            </div>
            <div class="sidebar">
                <div class="user-info">
                    <h3>Opponent: Stockfish Level 1</h3>
                    <div class="timer">10:00</div>
                </div>
                <div class="move-history">
                    <h4>Move History</h4>
                    <ul id="history"></ul>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
